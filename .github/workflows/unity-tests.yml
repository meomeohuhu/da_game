name: Unity acceptance (requires license)
on: workflow_dispatch
permissions:
  contents: read
  checks: write
jobs:
  unity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: [editmode, playmode]
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unity activation is configured
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$UNITY_LICENSE" && ( -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ) ]]; then
            echo '::error::Unity activation is not configured. See docs/TESTING_SETUP.vi.md. Local Hub testing is also supported; no passwords should be sent in chat.'
            exit 2
          fi
      - name: Import and test in Unity 2022 LTS
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 2022.3.62f1
          testMode: ${{ matrix.mode }}
          artifactsPath: TestResults/${{ matrix.mode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-${{ matrix.mode }}
          path: TestResults
          if-no-files-found: warn
