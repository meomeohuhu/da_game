name: Core rules
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run deterministic rules, seeded scenarios and strategy probes
        run: |
          mkdir -p TestResults
          dotnet run --project Tests/CoreHarness/CoreHarness.csproj --configuration Release | tee TestResults/core.log
      - name: Test combat visual effects
        run: node tools/test_combat_vfx.cjs
      - name: Verify first-wave tutorial continuation
        run: node tools/test_wave_start.cjs
      - name: Check Unity report parser rejects false passes
        run: python tools/test_unity_runner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: TestResults
